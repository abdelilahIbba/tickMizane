; ============================================================
; PHP-FPM Performance Settings
; ============================================================

[PHP]
; Max memory per script
memory_limit = 256M

; Max execution time (seconds)
max_execution_time = 60

; Upload settings
upload_max_filesize = 50M
post_max_size = 50M

; Error handling (off in production)
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Session handling via Redis (faster than files)
session.gc_maxlifetime = 3600
