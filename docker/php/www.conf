; ============================================================
; PHP-FPM Pool Configuration - Optimized for performance
; ============================================================

[www]
user = root
group = root

; Listen on TCP socket (better for Docker networking)
listen = 0.0.0.0:9000

; Process manager: dynamic = scale based on load
pm = dynamic

; Maximum number of child processes
pm.max_children = 20

; Number of processes created on startup
pm.start_servers = 4

; Minimum spare servers when idle
pm.min_spare_servers = 2

; Maximum spare servers when idle
pm.max_spare_servers = 8

; Recycle workers after N requests to prevent memory leaks
pm.max_requests = 500

; Slow request log (slowlog path is required when using request_slowlog_timeout)
slowlog = /var/log/php-fpm-slow.log
request_slowlog_timeout = 5s

; Status path for monitoring
pm.status_path = /fpm-status
