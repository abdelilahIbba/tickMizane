; ============================================================
; OPcache Configuration - Optimized for Laravel / PHP-FPM
; ============================================================

[opcache]
; Enable OPcache for PHP-FPM (web requests)
opcache.enable=1
opcache.enable_cli=0

; Memory allocated for storing precompiled PHP bytecode (MB)
opcache.memory_consumption=256

; Memory for interned strings (MB)
opcache.interned_strings_buffer=32

; Maximum number of files that can be cached
opcache.max_accelerated_files=20000

; Revalidation frequency (seconds). Set to 0 in prod, 2 for dev
opcache.revalidate_freq=2

; Save comments (required by some frameworks / annotations)
opcache.save_comments=1

; Enable fast shutdown sequence
opcache.fast_shutdown=1

; Validate timestamps (set to 0 in production for max speed)
opcache.validate_timestamps=1
