services:
  # ── Nginx web server ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: techmizane_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - build_assets:/var/www/html/public/build:ro
    depends_on:
      - app
    networks:
      - techmizane

  # ── PHP-FPM application ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: techmizane_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - .:/var/www/html
      # Named volumes overlay vendor/ and bootstrap/cache/ with image-baked copies,
      # bypassing the slow Windows→Docker filesystem for PHP class loading.
      - vendor_cache:/var/www/html/vendor
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - build_assets:/var/www/html/public/build
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - techmizane

  # ── Queue worker ──────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: techmizane_queue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    volumes:
      - .:/var/www/html
      - vendor_cache:/var/www/html/vendor
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - techmizane

  # ── Adminer – PostgreSQL web UI ───────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: techmizane_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - techmizane

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: techmizane_postgres
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-techmizane}
      POSTGRES_USER: ${DB_USERNAME:-techmizane}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-techmizane} -d ${DB_DATABASE:-techmizane}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techmizane

networks:
  techmizane:
    driver: bridge

volumes:
  postgres_data:
  build_assets:
  storage_logs:
  vendor_cache:
  bootstrap_cache:
